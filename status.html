    if (!t) { t = stored(); if (t === "auto") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "white"; }

/* ---------- theme: follow the panel ---------- */
(function followPanelTheme() {
  try {
    if (window.parent === window) return;
    const root = window.parent.document.documentElement;
    const sync = () => { const t = root.getAttribute("data-theme"); t ? document.documentElement.setAttribute("data-theme", t) : document.documentElement.removeAttribute("data-theme"); };
    new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
    sync();
  } catch (e) { /* not same-origin: keep the initial theme */ }

/* ---------- management API ---------- */
// Reuse the management key the panel stored (same origin), or ask once and keep it for this
// browser session. A reverse proxy that injects the key also works: any value is then replaced.
function panelKey() {
  try {
    const raw = localStorage.getItem("cli-proxy-auth");
    if (!raw || !raw.startsWith("enc::v2::")) return "";

    const b = atob(raw.slice(9)); const out = new Uint8Array(b.length);
    for (let i = 0; i < b.length; i++) out[i] = b.charCodeAt(i) ^ k[i % k.length];

async function api(method, path, body) {

  if (body !== undefined) headers["Content-Type"] = "application/json";
  const r = await fetch(path, { method, headers, credentials: "same-origin", body: body === undefined ? undefined : JSON.stringify(body) });
  if (r.status === 401 || (r.status === 404 && !mgmtKey)) {
    const k = await askKey();
    if (k) { mgmtKey = k; sessionStorage.setItem("budgetGuardKey", k); return api(method, path, body); }
  }
  const text = await r.text();
  let data; try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
  if (!r.ok) throw new Error((data && (data.error || data.message)) || ("HTTP " + r.status));

    <div class="bar"><span class="fill ${known === false ? "n" : tone(used, limit)}" style="width:${known === false ? 0 : Math.max(0, Math.min(100, used))}%;--i:${i}"></span>

/* ---------- state ---------- */
let status = null, cfg = null, loadErr = "", stats = null, statsErr = "", period = sessionStorage.getItem("budgetGuardPeriod") || "24h";
async function load(quiet) {
  try {

    try { stats = await api("GET", STATS + "?period=" + period); statsErr = ""; } catch (e) { stats = null; statsErr = e.message; }
    cfg = cfg || {}; cfg.keys = cfg.keys || []; loadErr = "";
    setTimeout(() => document.body.classList.remove("first"), 1500);

  render();
}

/* ---------- rendering ---------- */
function render() {
  const app = document.getElementById("app");
  if (!status) {
    app.innerHTML = header("") + (loadErr ? `<div class="error-box">${esc(loadErr)}</div>` : "");
    return;
  }
  const keys = cfg.keys || [];
  const ks = Object.fromEntries((status.keys || []).map((k) => [k.name, k]));
  const blocked = keys.filter((k) => isBlocked(ks[k.name])).length;
  const meta = [`${keys.length} key${keys.length === 1 ? "" : "s"}`, `${status.accounts.length} account${status.accounts.length === 1 ? "" : "s"}`]
    .concat(blocked ? [`<span class="bad">${blocked} blocked</span>`] : [])
    .concat([`updated ${new Date(status.now).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })}`]);
  app.innerHTML = header(meta.join(' <span class="dot">·</span> ')) +
    (loadErr ? `<div class="error-box">${esc(loadErr)}</div>` : "") +
    `<section class="section"><div class="section-head"><h2 class="section-title">Keys</h2>
       <span class="hint">Own share: the key's estimated usage of the whole pool's window. Pool ceiling: the key stops once all accounts together reach it.</span></div>
       ${keys.length ? `<div class="grid">${keys.map((k, i) => keyCard(k, ks[k.name], i)).join("")}</div>` :
       `<div class="empty"><div class="empty-title">No budgeted keys yet</div>
         <div class="empty-desc">Create one key per machine or CLI and give it a share of each limit window. Keys not listed here (like the admin key) are never limited.</div>
         <button class="btn btn-primary" data-act="add">${ICON.plus}Add key</button></div>`}</section>` +
    `<section class="section"><div class="section-head"><h2 class="section-title">Pool</h2>
       <span class="hint">Each subscription's limit windows, including usage outside the proxy. Capacity is the API-equivalent cost that fills a window, learned from traffic.</span></div>
       <div class="grid">${status.accounts.map(accountCard).join("") || '<div class="muted">No accounts yet.</div>'}</div></section>` +
    usageSection();
}
const PERIODS = ["1h", "5h", "24h", "7d", "30d"];
const tok = (n) => n >= 1e9 ? (n / 1e9).toFixed(2) + "B" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n);
function usageSection() {
  const seg = `<div class="seg">${PERIODS.map((p) => `<button data-act="period" data-p="${p}" class="${p === period ? "on" : ""}">${p}</button>`).join("")}</div>`;
  const head = `<section class="section"><div class="section-head"><h2 class="section-title">Usage</h2>
    <span class="hint">Every request through the proxy, from budget-guard's request log. Cost is API-equivalent. Cache hit: share of prompt tokens read from cache; a low hit rate with a high write share means conversations are hopping between accounts.</span></div>${seg}`;
  if (statsErr) return head + `<div class="error-box">${esc(statsErr)}</div></section>`;
  if (!stats) return head + `<div class="muted">loading</div></section>`;
  if (!stats.total.requests) return head + `<div class="muted">No requests logged in this period yet.</div></section>`;
  const labels = Object.fromEntries((status.accounts || []).map((a) => [a.id, a.label || a.id]));
  const hitTone = (g) => g.cache_read + g.cache_write + g.cached === 0 ? "" : g.cache_hit >= 0.85 ? "good" : g.cache_hit >= 0.6 ? "warn" : "bad";
  const rows = (groups, name) => groups.map((g) => `<tr><td title="${esc(name(g))}">${esc(name(g))}</td><td>${g.requests.toLocaleString()}</td><td>${usd(g.cost)}</td>
      <td>${tok(g.input + g.cache_read + g.cache_write)}</td><td>${tok(g.output)}</td>
      <td class="${hitTone(g)}">${g.cache_read + g.cache_write + g.cached ? pct(g.cache_hit * 100) : "–"}</td>
      <td>${g.cache_read + g.cache_write ? pct(g.write_share * 100) : "–"}</td></tr>`).join("");
  const table = (title, groups, name) => `<div class="card"><div class="group-title">${title}</div><table class="stats">
      <tr><th>${title.replace(/^By (.)/, (_, c) => c.toUpperCase())}</th><th>Requests</th><th>Cost</th><th>Prompt</th><th>Output</th><th>Cache hit</th><th>Writes</th></tr>
      ${rows(groups, name)}</table></div>`;
  const acc = (stats.accuracy || []).filter((a) => a.reported > 0 || a.predicted > 0);
  const accTone = (x) => x > 1.15 ? "bad" : x < 0.6 ? "warn" : "good";
  const accCard = `<div class="card"><div class="group-title">Estimate check</div>
    <div class="hint">For each account window: the rise the capacity estimate predicts from the proxy's own requests, against the rise the provider reported over the same span. Usage outside the proxy only adds to the reported rise, so a ratio at or under 100% is expected; well above 100% means the capacity is underestimated.</div>
    ${acc.length ? `<table class="stats"><tr><th>Account · window</th><th>Spans</th><th>Proxy cost</th><th>Predicted</th><th>Reported</th><th>Explained</th></tr>
      ${acc.map((a) => `<tr><td>${esc(labels[a.account] || a.account)} · ${esc(windowLabel(a.window))}</td><td>${a.intervals}</td><td>${usd(a.cost)}</td>
        <td>${a.predicted.toFixed(1)} pts</td><td>${a.reported.toFixed(1)} pts</td>${a.reported >= 5 ? `<td class="${accTone(a.explained)}">${pct(a.explained * 100)}</td>` : '<td class="muted" title="Shown once the provider has reported at least 5 points: its readings are whole percents">–</td>'}</tr>`).join("")}</table>`
      : '<div class="muted">Needs calibrated windows and a few reported rises in this period.</div>'}</div>`;

function header(meta) {

    <div class="actions"><button class="btn btn-ghost btn-icon" title="Refresh" data-act="refresh">${ICON.refresh}</button>

function isBlocked(k) { return !!(k && (k.providers || []).some((p) => (p.windows || []).some((w) => w.blocked))); }

  }

    const pst = st && (st.providers || []).find((p) => p.provider === provider);

/* ---------- modals ---------- */
function modal(title, body, footer, opts = {}) {
  const root = document.getElementById("modal-root");
  root.innerHTML = `<div class="overlay"><div class="modal" role="dialog" aria-modal="true" style="${opts.width ? "width:min(" + opts.width + ",100%)" : ""}">
    <div class="modal-header"><div class="modal-title">${esc(title)}</div><button class="close" data-close aria-label="Close">${ICON.x}</button></div>
    <div class="modal-body">${body}</div>${footer ? `<div class="modal-footer">${footer}</div>` : ""}</div></div>`;
  const ov = root.firstElementChild;
  const close = () => { root.innerHTML = ""; document.removeEventListener("keydown", onKey); opts.onClose && opts.onClose(); };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  ov.addEventListener("mousedown", (e) => { if (e.target === ov) close(); });
  ov.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", close));
  const first = ov.querySelector("input"); if (first) setTimeout(() => first.focus(), 50);
  return { el: ov, close };
}
function askKey() {
  return new Promise((resolve) => {
    let done = false;
    const m = modal("Management key", `<div class="field"><label>Management key</label><input class="input" type="password" id="mk" autocomplete="off">
      <span class="hint">Needed when this page isn't opened through the protected domain. Kept for this browser session only.</span></div>`,
      `<button class="btn btn-secondary" data-close>Cancel</button><button class="btn btn-primary" id="mk-ok">Continue</button>`,
      { onClose: () => { if (!done) resolve(""); } });
    const ok = () => { done = true; const v = m.el.querySelector("#mk").value.trim(); m.close(); resolve(v); };
    m.el.querySelector("#mk-ok").addEventListener("click", ok);
    m.el.querySelector("#mk").addEventListener("keydown", (e) => { if (e.key === "Enter") ok(); });
  });
}
function genKey() {
  const b = new Uint8Array(24); crypto.getRandomValues(b);
  return "sk-cpa-" + Array.from(b, (x) => x.toString(16).padStart(2, "0")).join("");
}
function providerWindows() {
  const out = {};
  for (const p of Object.keys(PROVIDERS)) out[p] = [];
  for (const w of status.windows || []) (out[w.provider] = out[w.provider] || []).push(w.window);
  return out;
}

function editKey(idx) {
  const isNew = idx == null;
  const orig = isNew ? { name: "", key: genKey(), budgets: {} } : JSON.parse(JSON.stringify(cfg.keys[idx]));

    pw[p] = pw[p] || [];
    for (const m of [b.own_share || {}, b.pool_ceiling || {}]) for (const w of Object.keys(m)) if (w !== "*" && !pw[p].includes(w)) pw[p].push(w);
  }

  const table = (p) => {
    const b = (orig.budgets || {})[p] || {}; const own = b.own_share || {}, ceil = b.pool_ceiling || {};

        <td class="w"><div class="pct"><input class="input num" type="number" min="0" max="100" step="1" data-k="ceil" data-w="${esc(w)}" value="${ceil[w] ?? ""}" placeholder="–"></div></td></tr>`).join("") + `</table>`;
  };

      <span class="hint">One key per machine or CLI.</span></div>

      <button class="btn btn-secondary btn-sm" id="kcopy" type="button">${ICON.copy}Copy</button><button class="btn btn-secondary btn-sm" id="kgen" type="button">New</button></div>
      <span class="hint">Added to the proxy's client keys on save. Leave a limit empty for no limit.</span></div>
    <div class="tabs">${provs.map((p, i) => `<button class="tab${i ? "" : " on"}" data-tab="${p}" type="button">${esc(PROVIDERS[p] || p)}</button>`).join("")}</div>

    <div class="err-text" id="kerr"></div>`;

  const $ = (s) => m.el.querySelector(s);

    } catch (e) { err.textContent = e.message; btn.disabled = false; btn.textContent = isNew ? "Create key" : "Save"; }
  });
}

async function saveKeys(keys, addApiKeys, removeApiKeys) {
  if (addApiKeys.length) {
    const ak = (await api("GET", API_KEYS)) || [];
    const next = ak.concat(addApiKeys.filter((k) => !ak.includes(k)));
    if (next.length !== ak.length) await api("PUT", API_KEYS, next);
  }
  const current = (await api("GET", PLUGIN_CFG)) || {};
  current.keys = keys;
  await api("PUT", PLUGIN_CFG, current);
  if (removeApiKeys.length) {
    const ak = (await api("GET", API_KEYS)) || [];
    const next = ak.filter((k) => !removeApiKeys.includes(k));
    if (next.length !== ak.length) await api("PUT", API_KEYS, next);
  }
  await new Promise((r) => setTimeout(r, 700)); // let the plugin pick up the new config
  await load(true);
}

function deleteKey(idx) {
  const k = cfg.keys[idx];
  const m = modal("Delete " + k.name, `<p>This removes the key from the budgets <b>and</b> from the proxy's client keys, so any machine using it stops working.</p>`,
    `<button class="btn btn-secondary" data-close>Cancel</button><button class="btn btn-danger" id="del">Delete key</button>`, { width: "460px" });
  m.el.querySelector("#del").addEventListener("click", async (e) => {
    e.target.disabled = true;
    try { await saveKeys(cfg.keys.filter((_, i) => i !== idx), [], [k.key]); m.close(); toast("Deleted " + k.name); }
    catch (err) { toast(err.message, true); e.target.disabled = false; }
  });
}

function connect(idx) {
  const k = cfg.keys[idx], base = location.origin;
  const snip = (s) => `<pre class="snippet"><button class="btn btn-secondary btn-sm" data-copy="${esc(s)}">${ICON.copy}Copy</button>${esc(s)}</pre>`;
  const claude = `export ANTHROPIC_BASE_URL=${base}\nexport ANTHROPIC_AUTH_TOKEN=${k.key}`;
  const claudeJson = JSON.stringify({ env: { ANTHROPIC_BASE_URL: base, ANTHROPIC_AUTH_TOKEN: k.key } }, null, 2);
  const codex = `# ~/.codex/config.toml\nmodel_provider = "cpa"\n\n[model_providers.cpa]\nname = "CLIProxyAPI"\nbase_url = "${base}/v1"\nenv_key = "CPA_API_KEY"\nwire_api = "responses"`;
  const m = modal("Connect " + k.name,
    `<div class="hint" style="margin-bottom:12px">Use this key only on <b>${esc(k.name)}</b> so its usage is counted against its budget.</div>
     <label><b>Claude Code</b> — shell</label>${snip(claude)}
     <details><summary>or ~/.claude/settings.json</summary>${snip(claudeJson)}</details>
     <label><b>Codex CLI</b></label>${snip(codex)}${snip("export CPA_API_KEY=" + k.key)}
     <label><b>Any OpenAI-compatible client</b></label>${snip(`base URL: ${base}/v1\nAPI key:  ${k.key}`)}`,
    `<button class="btn btn-primary" data-close>Done</button>`);
  m.el.querySelectorAll("[data-copy]").forEach((b) => b.addEventListener("click", () => copy(b.dataset.copy)));
}

function settings() {
  const pricing = (cfg.pricing || []).map((r) => ({ ...r }));
  const prow = (r, i) => `<tr data-i="${i}">
    <td><select class="input" data-f="provider">${["", "claude", "codex"].map((p) => `<option value="${p}"${(r.provider || "") === p ? " selected" : ""}>${p ? PROVIDERS[p] : "Any"}</option>`).join("")}</select></td>
    <td><input class="input" data-f="match" value="${esc(r.match || "")}" placeholder="any model"></td>
    ${["input", "output", "cache_read", "cache_write", "cache_write_1h"].map((f) => `<td class="w" style="width:92px"><input class="input num" type="number" min="0" step="any" data-f="${f}" value="${r[f] ?? ""}"></td>`).join("")}
    <td><button class="btn btn-ghost btn-icon" data-rm="${i}" title="Remove">${ICON.trash}</button></td></tr>`;
  const body = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 16px">
      <div class="field"><label for="pi">Usage polling</label><input class="input" id="pi" value="${esc(cfg.poll_interval || "3m")}">
        <span class="hint">How often each account's limits are fetched, e.g. 3m.</span></div>
      <div class="field"><label for="cs">Calibration step</label><div class="pct"><input class="input num" id="cs" type="number" min="1" max="20" step="1" value="${cfg.calibration_step ?? 3}"></div>
        <span class="hint">Usage rise that closes a calibration sample.</span></div></div>
    <div class="field"><label>Price weights <span class="muted">(USD per 1M tokens)</span></label>
      <span class="hint">Only ratios matter — they decide how much a request counts relative to others (Opus vs Haiku, output vs cache reads). Rules here are checked before the built-in API prices; first match wins.</span></div>
    <table class="edit" id="pt"><tr><th>Provider</th><th>Model contains</th><th>Input</th><th>Output</th><th>Cache read</th><th>Cache write</th><th>1h write</th><th></th></tr>${pricing.map(prow).join("")}</table>
    <button class="btn btn-ghost btn-sm" id="padd" style="margin-top:8px">${ICON.plus}Add rule</button>
    <details style="margin-top:12px"><summary>Built-in weights (API list prices)</summary>
      <table class="edit"><tr><th>Provider</th><th>Model contains</th><th>Input</th><th>Output</th><th>Cache read</th><th>Cache write</th><th>1h write</th></tr>
      ${(status.pricing_defaults || []).map((r) => `<tr><td>${esc(PROVIDERS[r.provider] || r.provider || "Any")}</td><td class="mono">${esc(r.match || "any")}</td>
        ${[r.input, r.output, r.cache_read, r.cache_write, r.cache_write_1h || 2 * r.input].map((v) => `<td class="num">${v ? "$" + v : "–"}</td>`).join("")}</tr>`).join("")}</table></details>
    <div class="err-text" id="serr" style="margin-top:8px"></div>`;
  const m = modal("Settings", body, `<button class="btn btn-secondary" data-close>Cancel</button><button class="btn btn-primary" id="ssave">Save</button>`, { width: "900px" });
  const $ = (s) => m.el.querySelector(s);
  const collect = () => Array.from(m.el.querySelectorAll("#pt tr[data-i]")).map((tr) => {
    const r = {};
    tr.querySelectorAll("[data-f]").forEach((inp) => {
      const f = inp.dataset.f;
      if (f === "provider" || f === "match") { if (inp.value.trim()) r[f] = inp.value.trim().toLowerCase(); }
      else if (inp.value !== "") r[f] = Number(inp.value);
    });
    return r;
  });
  const redraw = (rows) => {
    $("#pt").innerHTML = `<tr><th>Provider</th><th>Model contains</th><th>Input</th><th>Output</th><th>Cache read</th><th>Cache write</th><th>1h write</th><th></th></tr>` + rows.map(prow).join("");
    m.el.querySelectorAll("[data-rm]").forEach((b) => b.addEventListener("click", () => { const r = collect(); r.splice(+b.dataset.rm, 1); redraw(r); }));
  };
  redraw(pricing);
  $("#padd").addEventListener("click", () => redraw(collect().concat([{}])));
  $("#ssave").addEventListener("click", async () => {
    const pi = $("#pi").value.trim(), cs = Number($("#cs").value);
    if (!/^\d+(\.\d+)?(s|m|h)$/.test(pi)) return ($("#serr").textContent = "Polling interval looks like 3m, 90s or 1h.");
    if (!(cs >= 1 && cs <= 20)) return ($("#serr").textContent = "Calibration step must be between 1 and 20.");
    const rules = collect().filter((r) => Object.keys(r).length);
    if (rules.some((r) => r.input == null || r.output == null)) return ($("#serr").textContent = "Each price rule needs at least input and output prices.");
    const btn = $("#ssave"); btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Saving';
    try {
      const current = (await api("GET", PLUGIN_CFG)) || {};
      current.poll_interval = pi; current.calibration_step = cs;
      if (rules.length) current.pricing = rules; else delete current.pricing;
      await api("PUT", PLUGIN_CFG, current);
      await new Promise((r) => setTimeout(r, 700)); await load(true);
      m.close(); toast("Settings saved");
    } catch (e) { $("#serr").textContent = e.message; btn.disabled = false; btn.textContent = "Save"; }
  });
}

/* ---------- misc ---------- */
function toast(msg, bad) {
  const t = document.createElement("div"); t.className = "toast" + (bad ? " bad" : ""); t.textContent = msg;
  document.getElementById("toasts").appendChild(t); setTimeout(() => t.remove(), bad ? 6000 : 2800);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch (e) { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("Copied"); }
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const i = b.dataset.i == null ? null : +b.dataset.i;
  ({ add: () => editKey(null), edit: () => editKey(i), delete: () => deleteKey(i), connect: () => connect(i), settings, refresh: () => load(),
    period: () => { period = b.dataset.p; sessionStorage.setItem("budgetGuardPeriod", period); stats = null; render(); load(true); } })[b.dataset.act]();
});
load();
setInterval(() => { if (!document.getElementById("modal-root").firstChild && !document.hidden) load(true); }, 30000);
</script>
</body>
</html>
